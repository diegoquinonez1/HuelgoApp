services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: personalhub
      POSTGRES_PASSWORD: personalhub_dev
      POSTGRES_DB: personalhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: personalhub
      RABBITMQ_DEFAULT_PASS: personalhub_dev
    ports:
      - "5672:5672"
      - "15672:15672"  # management UI

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: Y
    ports:
      - "5341:5341"
      - "8081:80"

volumes:
  postgres_data:
